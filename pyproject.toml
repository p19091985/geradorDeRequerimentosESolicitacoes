[project]
name = "gerador-de-requerimentos-e-solicitacoes"
version = "0.1.0"
description = "Aplicacao desktop para criar, editar e exportar documentos HTML em PNG, JPG e PDF."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
