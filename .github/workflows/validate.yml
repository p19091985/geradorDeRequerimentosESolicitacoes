name: Validate

on:
  push:
  pull_request:

jobs:
  quick-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m py_compile \
            ttk_pdf_generator.py \
            capture_html_screenshot.py \
            core/*.py \
            rendering/*.py \
            storage/*.py \
            test_capture_html_screenshot.py \
            test_core_storage.py \
            test_template_catalog.py

      - name: Run fast unit tests
        run: |
          python -m unittest test_core_storage.py test_template_catalog.py

      - name: Validate shell script
        run: bash -n iniciar.sh
